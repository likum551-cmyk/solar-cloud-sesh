<!doctype html>
<!-- Setup wizard artwork, rendered to PNG by render.mjs (?kind=side|mark).
     side: the Welcome/Finish panel, a loading-screen crop of the key art
     fading into the NOON ground with the stacked Solar RP lockup at its foot.
     mark: the header badge, the gold S tile (reads on a light and a dark header). -->
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  .side { position: relative; width: 100vw; height: 100vh; background: #0a0907; overflow: hidden; }
  .side img.art {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 57% 0;
  }
  .side .fade {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(10,9,7,0) 40%, rgba(10,9,7,.74) 58%, #0a0907 74%);
  }
  .side .foot { position: absolute; left: 14vw; right: 14vw; bottom: 8vh; }
  .side .lockup { display: block; width: 100%; height: auto; }
  .mark { width: 100vw; height: 100vh; display: grid; place-items: center; }
  .mark img { width: 84%; height: 84%; }
</style>
<div id="root"></div>
<script>
  const kind = new URLSearchParams(location.search).get('kind') || 'side';
  const root = document.getElementById('root');
  root.innerHTML = kind === 'mark'
    ? '<div class="mark"><img src="/brand/solar/solar-rp-noon/icons/solar-rp-icon-noon-gold-256.svg" alt=""></div>'
    : '<div class="side"><img class="art" src="/docs/archive/web-legacy/src/assets/gta/splash-michael.webp" alt="">' +
      '<div class="fade"></div><div class="foot">' +
      '<img class="lockup" src="/brand/solar/solar-rp-noon/solar-rp-stacked-noon-full.svg" alt="">' +
      '</div></div>';
  window.ready = Promise.all([...document.images].map((i) => i.decode()));
</script>
